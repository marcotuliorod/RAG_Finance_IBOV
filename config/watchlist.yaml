# Watchlist de tickers para ingestão por ação — via brapi.dev
# (rag_b3.ingestion.brapi), 1 requisição para a lista inteira.
#
# Reativada em 2026-08-24: a HG Brasil free bloqueia /finance/stock_price
# inteiramente (confirmado ao vivo em 2026-07-11 — ver
# rag_b3.ingestion.hg_brasil.errors.HgBrasilPlanRestrictedError), então a
# cotação por ticker passou a ser feita pelo brapi.dev. O job HG Brasil por
# ticker continua no código como fallback testado, mas desligado por padrão
# (settings.hg_brasil_stock_price_enabled=False) para não gastar cota nem
# gerar ruído no audit log rodando contra um endpoint bloqueado.
#
# PETR4/VALE3/ITUB4/MGLU3 respondem sem token brapi; os demais exigem
# BRAPI_TOKEN (plano free, ver .env.example).

