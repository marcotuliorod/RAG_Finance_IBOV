name: CI

# Deliberately does NOT run scripts/run_eval.py or the llm_eval test marker
# here — those make real, billed Anthropic API calls (~US$0.74/run measured
# in docs/evaluation/baseline.md). Running that on every push/PR would be
# both slow and costly. See .github/workflows/eval.yml for the
# manually/scheduled-triggered evaluation + regression gate instead.
on:
  push:
    branches: [main]
  pull_request:

env:
  # Necessário só para o pydantic-settings validar (ANTHROPIC_API_KEY é
  # obrigatório em Settings), não para nenhuma chamada real de API — os
  # jobs de CI abaixo nunca chamam a Anthropic API de verdade.
  ANTHROPIC_API_KEY: dummy-for-ci
  HG_BRASIL_API_KEY: dummy-for-ci
  DATABASE_URL: postgresql://postgres:localdev@localhost:5433/postgres

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run ruff check src tests scripts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      # Não bloqueante ainda: baseline de 18 erros pré-existentes medida em
      # 2026-08-27 (ver docs/audit/TECHNICAL_AUDIT.md F-18 e o comentário em
      # pyproject.toml [tool.mypy]). O objetivo desta etapa é dar
      # visibilidade real ao tipo de dívida técnica, não fingir que já foi
      # zerada — remover `continue-on-error` quando a baseline for corrigida.
      - run: uv run mypy src
        continue-on-error: true

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run pytest -q

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: localdev
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      # Prova, no próprio CI, que scripts/apply_migrations.py roda contra
      # um Postgres genuinamente novo sem falhar (ver docs/audit/
      # TECHNICAL_AUDIT.md F-12 — idempotência corrigida na Sessão 6).
      - run: uv run python scripts/apply_migrations.py
      # tests/integration/ e tests/e2e/ verificam valores reais (ex.:
      # máxima histórica = 198.657 pontos) — não passam contra um banco
      # vazio recém-migrado. db/seed/dev_seed.sql é um snapshot dos dados
      # públicos reais (série do Ibovespa + itens de feeds da CVM) para dar
      # um banco reproduzível e determinístico ao CI, sem depender das
      # APIs externas de ingestão (que têm suas próprias chaves/quotas).
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/dev_seed.sql
      - run: uv run pytest -q -m integration tests/integration/ tests/e2e/

  security-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: localdev
        ports:
          - "5433:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run python scripts/apply_migrations.py
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/seed/dev_seed.sql
      - run: uv run pytest -q -m integration tests/security/
      # Dependency vulnerability scan (F-09) — roda em todo push/PR, ao
      # contrário do eval real, porque não custa nada além de tempo de CI.
      - run: uv run pip-audit --desc

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rag-b3-app:ci .
