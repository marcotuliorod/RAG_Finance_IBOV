[project]
name = "rag-b3"
version = "0.1.0"
description = "RAG especializado no índice Ibovespa — ingestão (HG Brasil, Yahoo Finance, CVM RSS), consulta numérica determinística, busca textual e geração com tool-use via Claude"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "feedparser>=6.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "PyYAML>=6.0",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "time-machine>=2.14",
    "ruff>=0.4",
    "pip-audit>=2.10",
    "mypy>=1.11",
]
[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: requires a local Postgres instance (docker); not run by default",
    "llm_eval: requires Postgres + a real ANTHROPIC_API_KEY (generator + judge calls, has token cost); not run by default",
]
addopts = "-m 'not integration and not llm_eval'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# Baseline de 18 erros pré-existentes medida em 2026-08-27 (ver
# docs/audit/TECHNICAL_AUDIT.md F-18) — mypy roda em CI como etapa de
# relatório (não bloqueia o pipeline ainda). Não suprimimos os erros com
# `# type: ignore` em massa porque isso esconderia a baseline real; a
# intenção é reduzir esse número incrementalmente, não fingir que já é
# zero.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
