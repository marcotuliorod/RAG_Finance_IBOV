[project]
name = "rag-b3"
version = "0.1.0"
description = "Ingestão de dados de mercado (HG Brasil) e regulatório (CVM RSS) para o RAG Financeiro B3"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "feedparser>=6.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "psycopg[binary]>=3.1",
    "PyYAML>=6.0",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "time-machine>=2.14",
    "ruff>=0.4",
]
[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: requires a local Postgres instance (docker); not run by default",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
